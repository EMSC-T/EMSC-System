<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMSC-T | البوابة الرقمية الموحدة</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <style>
        :root { --gov-blue: #0A2540; --gov-gold: #C0A160; --gov-green: #2E7D32; --bg-light: #f4f6f9; }
        body { background-color: var(--bg-light); font-family: 'Cairo', sans-serif; display: flex; flex-direction: column; min-height: 100vh; }
        .hero-section { background: linear-gradient(135deg, var(--gov-blue) 0%, #1a436e 100%); color: white; padding: 50px 20px; text-align: center; border-bottom: 5px solid var(--gov-gold); }
        .hero-section h1 { font-weight: 900; font-size: 2.2rem; }
        .container-main { max-width: 1100px; margin: -30px auto 40px; padding: 0 20px; flex: 1; }
        .portal-card { background: white; border-radius: 20px; padding: 30px 20px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.1); border: 1px solid #eee; transition: 0.4s; text-decoration: none; display: block; color: inherit; height: 100%; position: relative; overflow: hidden; }
        .portal-card:hover { transform: translateY(-10px); box-shadow: 0 15px 40px rgba(0,0,0,0.15); border-color: var(--gov-blue); }
        .portal-card::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 5px; background: var(--gov-gold); }
        .portal-icon { font-size: 3rem; color: var(--gov-blue); margin-bottom: 15px; }
        .portal-title { font-weight: 800; font-size: 1.3rem; color: var(--gov-blue); }
        .footer { text-align: center; padding: 20px; font-weight: 600; color: #888; font-size: 0.9rem; margin-top: auto; }
    </style>
</head>
<body>

<div class="hero-section">
    <i class="fa-solid fa-shield-heart fa-3x mb-3" style="color: var(--gov-gold);"></i>
    <h1>EMSC-T</h1>
    <p>بوابة الخدمات الرقمية الموحدة - مكتب طرابلس</p>
</div>

<div class="container-main">
    <div class="row g-4">
        <div class="col-md-4">
            <a href="doctor.html" class="portal-card">
                <i class="fa-solid fa-user-doctor portal-icon"></i>
                <h3 class="portal-title">المنظومة الطبية</h3>
                <p class="text-muted small">تسجيل الكشوفات وصرف العلاج</p>
                <button class="btn btn-sm btn-outline-primary fw-bold mt-3">دخول العيادة</button>
            </a>
        </div>

        <div class="col-md-4">
            <a href="supervisor.html" class="portal-card">
                <i class="fa-solid fa-clipboard-user portal-icon"></i>
                <h3 class="portal-title">إدارة العيادة</h3>
                <p class="text-muted small">مراقبة السجلات وطلب النواقص</p>
                <button class="btn btn-sm btn-outline-primary fw-bold mt-3">دخول المشرف</button>
            </a>
        </div>

        <div class="col-md-4">
            <a href="store.html" class="portal-card" style="border-top-color: var(--gov-green);">
                <i class="fa-solid fa-warehouse portal-icon" style="color: var(--gov-green);"></i>
                <h3 class="portal-title">المخازن المركزية</h3>
                <p class="text-muted small">اعتماد الطلبيات وصرف الإمدادات</p>
                <button class="btn btn-sm btn-outline-success fw-bold mt-3">دخول الإدارة</button>
            </a>
        </div>
    </div>
</div>

<footer class="footer">
    تم التطوير بواسطة الدعم الفني - مكتب طرابلس © 2026
</footer>

    
</body>
</html>
